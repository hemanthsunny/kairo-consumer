name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aqzbnqbuxvbgwtendieh
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test
        working-directory: supabase/functions
        run: |
          deno check api/index.ts
          deno test -q _shared/
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy api function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
